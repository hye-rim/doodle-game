<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#fff4df">
<title>공책 낙서 지우기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  /* 아이폰 사파리: 버튼을 누르다 글자·이모지가 선택되거나 길게 눌러 메뉴가 뜨지 않게 */
  *, *::before, *::after { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  :root { --ink:#33254f; --pink:#ff7795; --yellow:#ffd95a; --paper:#fffaf0; --muted:#796d88; }
  * { box-sizing:border-box; margin:0; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; min-height:100%; background:#f6dfbd; color:var(--ink); font-family:'Jua',-apple-system,'Apple SD Gothic Neo',sans-serif; }
  body { min-height:100dvh; display:grid; place-items:center; padding:14px; }
  button { font:inherit; color:inherit; }
  #app { width:min(100%,520px); position:relative; }
  .top { display:grid; grid-template-columns:1fr 1fr 1.3fr auto; gap:6px; margin-bottom:12px; }
  .pill { min-width:0; height:42px; display:flex; align-items:center; justify-content:center; gap:5px; padding:0 8px; white-space:nowrap; border:3px solid var(--ink); border-radius:99px; background:white; box-shadow:0 4px 0 var(--ink); font-variant-numeric:tabular-nums; }
  .pill.score { background:var(--yellow); }
  .pill span:first-child { color:var(--muted); font-size:12px; }
  .pill strong { font-size:19px; font-weight:400; }
  .icon-button { width:42px; height:42px; border:3px solid var(--ink); border-radius:14px; background:white; box-shadow:0 4px 0 var(--ink); font-size:18px; cursor:pointer; }
  .icon-button:active,.primary:active { transform:translateY(3px); box-shadow:0 1px 0 var(--ink); }
  .notebook { position:relative; padding:22px 20px 20px 38px; min-height:590px; border:4px solid var(--ink); border-radius:18px 22px 20px 16px; background-color:var(--paper); background-image:linear-gradient(90deg, transparent 0 28px, rgba(255,110,135,.38) 28px 30px, transparent 30px), repeating-linear-gradient(transparent 0 34px, #d7e8f2 34px 36px); box-shadow:0 9px 0 var(--ink), 0 16px 25px #8b624544; overflow:hidden; }
  .notebook:before { content:''; position:absolute; left:8px; top:16px; bottom:16px; width:12px; background:radial-gradient(circle,#f6dfbd 0 5px,transparent 5.5px) center top/12px 42px repeat-y; }
  .heading { display:flex; justify-content:space-between; align-items:center; min-height:34px; }
  .heading small { color:var(--muted); font-size:14px; }
  .level { padding:4px 12px; border:2px solid var(--ink); border-radius:99px; background:#e7f4ff; }
  h1 { margin:9px 0 2px; font-size:clamp(27px,7vw,36px); font-weight:400; letter-spacing:-1px; }
  .subtitle { color:var(--muted); line-height:1.45; font-size:15px; }
  .mission { margin:17px 0 13px; padding:9px 13px; display:flex; align-items:center; justify-content:center; gap:10px; border:3px dashed #ed8ba0; border-radius:14px; background:#fff0f3; font-size:17px; }
  .mission .target { display:grid; place-items:center; width:42px; height:42px; border:2px solid #f2b5c0; border-radius:12px; background:#fff; font-size:29px; transform:rotate(-5deg); }
  #board { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; align-content:start; padding:3px 0 12px; }
  .doodle { aspect-ratio:1; position:relative; border:2px solid #d8cce6; border-radius:14px 10px 15px 11px; background:rgba(255,255,255,.88); display:grid; place-items:center; font-size:clamp(25px,8vw,39px); cursor:pointer; transition:transform .12s, opacity .15s, background .15s; touch-action:manipulation; box-shadow:0 2px 0 #d8cce6; }
  .doodle:nth-child(3n) { border-radius:11px 16px 10px 15px; }
  .doodle:nth-child(4n+1) { transform:rotate(-3deg); }
  .doodle:nth-child(4n+2) { transform:rotate(2deg); }
  .doodle:active { transform:scale(.91) rotate(0); }
  .doodle.found { opacity:0; transform:scale(.35) rotate(22deg); pointer-events:none; }
  .doodle.wrong { animation:wrong .28s ease; background:#ffd8de; border-color:#ff6f82; }
  @keyframes wrong { 25%{transform:translateX(-5px) rotate(-4deg)} 70%{transform:translateX(5px) rotate(4deg)} }
  .eraser-row { height:25px; display:flex; align-items:center; gap:9px; color:var(--muted); font-size:14px; }
  .track { flex:1; height:12px; overflow:hidden; border:2px solid var(--ink); border-radius:99px; background:white; }
  #progress { width:0; height:100%; background:linear-gradient(90deg,#ff97ad,#ffd95a); transition:width .2s; }
  #feedback { min-height:27px; padding-top:5px; text-align:center; color:#b34d70; font-size:16px; }
  .overlay { position:absolute; inset:0; z-index:5; display:grid; place-items:center; padding:20px; border-radius:20px; background:#34254fbb; backdrop-filter:blur(3px); }
  .overlay.hidden { display:none; }
  .card { width:min(100%,390px); max-height:100%; overflow:auto; padding:23px 20px; text-align:center; border:4px solid var(--ink); border-radius:22px; background:var(--paper); box-shadow:0 7px 0 var(--ink); }
  .card .sticker { font-size:53px; line-height:1.1; }
  .card h2 { margin:9px 0 8px; font-size:32px; font-weight:400; }
  .card p { color:var(--muted); font-size:16px; line-height:1.55; }
  .card b { color:#e65b82; font-weight:400; }
  .primary { margin-top:17px; min-height:52px; padding:9px 30px; border:3px solid var(--ink); border-radius:99px; background:var(--yellow); box-shadow:0 5px 0 var(--ink); font-size:22px; cursor:pointer; }
  .small { margin-top:12px!important; font-size:13px!important; }
  @media(max-height:720px) { body{padding:8px} .top{margin-bottom:8px}.notebook{min-height:0;padding-top:14px;padding-bottom:12px}.mission{margin:10px 0 8px;padding:6px 10px}.mission .target{width:35px;height:35px;font-size:25px}#board{gap:6px;padding-bottom:5px}.doodle{font-size:clamp(22px,6vh,34px)}#feedback{min-height:21px;padding-top:2px} }
  @media(max-width:380px) { .notebook{padding-left:34px;padding-right:13px} #board{gap:5px}.doodle{border-radius:10px} }
</style>
</head>
<body>
<main id="app">
  <header class="top" aria-label="게임 정보">
    <div class="pill score"><span>점수</span><strong id="score">0</strong></div>
    <div class="pill"><span>최고</span><strong id="best">0</strong></div>
    <div class="pill"><span>시간</span><strong id="time">45.0초</strong></div>
    <button class="icon-button" id="pause" aria-label="일시정지" title="일시정지">Ⅱ</button>
  </header>
  <section class="notebook" aria-label="공책 낙서 찾기">
    <div class="heading"><small>오늘의 공책 · 1교시</small><small class="level">Lv. <span id="level">1</span></small></div>
    <h1>공책 낙서 지우기</h1>
    <p class="subtitle">선생님 오시기 전에 미션 낙서만 쓱쓱 지워요!</p>
    <div class="mission"><span>이 낙서만 찾아요</span><span class="target" id="target" aria-label="찾을 그림">⭐</span></div>
    <div id="board" role="group" aria-label="낙서판"></div>
    <div class="eraser-row"><span>지우개</span><div class="track"><div id="progress"></div></div><span id="remaining">0개 남음</span></div>
    <div id="feedback" aria-live="polite"></div>
  </section>
  <section class="overlay" id="overlay" aria-modal="true" role="dialog">
    <div class="card" id="card"></div>
  </section>
</main>
<script src="game.js"></script>
</body>
</html>
